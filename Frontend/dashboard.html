<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Dashboard</h1>

            <h2 id="welcomeUser">
                Welcome
            </h2>

            <p id="userEmail"></p>

            <p id="userRole"></p>

            <button id="logoutBtn">
                Logout
            </button>

        </div>


        <!-- CUSTOMER BUTTONS -->

        <div id="customerButtons">

            <button id="ticketsBtn">
                Create Ticket
            </button>

            <button id="viewTicketsBtn">
                My Tickets
            </button>

        </div>


        <!-- AGENT BUTTONS -->

        <div id="agentButtons">

            <button id="agentBtn">
                Agent Dashboard
            </button>

        </div>


        <!-- ADMIN BUTTONS -->

        <div id="adminButtons">

            <button id="adminBtn">
                Admin Dashboard
            </button>

        </div>

    </div>


    <script src="dashboard.js"></script>

</body>

</html>
