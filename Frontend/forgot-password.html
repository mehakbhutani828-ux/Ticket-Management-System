<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="forgot-password-container">

        <div class="forgot-password-card">

            <!-- EMAIL STEP -->
            <div id="emailStep">

                <h1>Forgot Password?</h1>

                <p class="subtitle">
                    Enter your registered email address and
                    we'll send you an OTP.
                </p>

                <form id="emailForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        id="sendOtpBtn"
                    >
                        Send OTP
                    </button>

                </form>

                <div
                    id="emailMessage"
                    class="form-message"
                ></div>

                <button
                    type="button"
                    class="back-login-btn"
                    onclick="goToLogin()"
                >
                    ← Back to Login
                </button>

            </div>


            <!-- OTP STEP -->
            <div
                id="otpStep"
                class="hidden"
            >

                <h1>Verify OTP</h1>

                <p class="subtitle">
                    Enter the 6-digit OTP sent to
                    <strong id="emailDisplay"></strong>
                </p>

                <form id="otpForm">

                    <div class="form-group">

                        <label for="otp">
                            Enter OTP
                        </label>

                        <input
                            type="text"
                            id="otp"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        id="verifyOtpBtn"
                    >
                        Verify OTP
                    </button>

                </form>

                <div
                    id="otpMessage"
                    class="form-message"
                ></div>

                <button
                    type="button"
                    id="resendOtpBtn"
                    class="secondary-btn"
                >
                    Resend OTP
                </button>

                <button
                    type="button"
                    class="back-login-btn"
                    onclick="goToLogin()"
                >
                    ← Back to Login
                </button>

            </div>


            <!-- PASSWORD STEP -->
            <div
                id="passwordStep"
                class="hidden"
            >

                <h1>Reset Password</h1>

                <p class="subtitle">
                    Enter your new password below.
                </p>

                <form id="passwordForm">

                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        id="resetPasswordBtn"
                    >
                        Reset Password
                    </button>

                </form>

                <div
                    id="passwordMessage"
                    class="form-message"
                ></div>

            </div>

        </div>

    </div>

    <script src="forgot-password.js"></script>

</body>
</html>
