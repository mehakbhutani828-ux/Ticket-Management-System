
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>View Tickets</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

       <div class="container">

        


        <div class="card">

            <h2>All Tickets</h2>

            <p id="ticketCount">
                Loading...

            <div id="paginationInfo"></div>

                <button id="nextPageBtn" disabled>
                    Next

            </div>

        </div>
        

            <button id="logoutBtn">
                Logout
            </button>

        

    </div>

    <script src="view.js"></script>
